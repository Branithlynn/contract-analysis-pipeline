server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 10 files x 20 MB per upload request, plus multipart overhead.
    client_max_body_size 210m;

    # Same origin for the ui and the api, so no CORS anywhere (the vite dev proxy does the same).
    # Uploads and reads never wait on the llm, the ui polls, so they keep the default 60s read
    # timeout. The two ask locations below are the exception.
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # Stream uploads straight to the api instead of spooling up to 210 MB to disk here first.
    # Chunked request bodies are only passed through unbuffered over HTTP/1.1.
    proxy_http_version 1.1;
    proxy_request_buffering off;

    # Everything of the api that is not named below, the stored files of the documents
    # (/api/documents/<id>/file) included: those are streamed through like any other response.
    location /api/ {
        proxy_pass http://api:3000;
    }

    # A question waits for the agent inside the request, up to ASK_TIMEOUT_MS (180s by default).
    # A bit above that, so the api's own 504 with the steps so far arrives instead of nginx's.
    # Raise the two together.
    location = /api/ask {
        proxy_pass http://api:3000;
        proxy_read_timeout 200s;
    }

    # The same question as server-sent events. Unbuffered, or nginx holds the events back until
    # its buffer is full and they arrive in one piece at the end. The header says the same to
    # any proxy in front of this one.
    location = /api/ask/stream {
        proxy_pass http://api:3000;
        proxy_read_timeout 200s;
        proxy_buffering off;
        add_header X-Accel-Buffering no always;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    # SPA fallback: unknown paths get index.html and the client takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
