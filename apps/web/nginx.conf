server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 10 files x 20 MB per upload request, plus multipart overhead.
    client_max_body_size 210m;

    # Same origin for the ui and the api, so no CORS anywhere (the vite dev proxy does the same).
    # No long read timeout: nothing waits on the llm inside a request, the ui polls.
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # Stream uploads straight to the api instead of spooling up to 210 MB to disk here first.
    # Chunked request bodies are only passed through unbuffered over HTTP/1.1.
    proxy_http_version 1.1;
    proxy_request_buffering off;

    location /api/ {
        proxy_pass http://api:3000;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    # SPA fallback: unknown paths get index.html and the client takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
