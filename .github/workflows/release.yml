name: release

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: create the release. packages: push to ghcr.
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      # ghcr refuses uppercase in image names and the owner name has capitals in it.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # arm64 is built under emulation, the runner is amd64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.0.0 becomes 1.0.0. latest is added on its own for normal versions and left alone for
      # pre-releases like v1.1.0-rc.1, so latest never points at a release candidate.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/contract-analysis-pipeline-${{ matrix.target }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          # arm64 works without a compiler because better-sqlite3 has linux-arm64 in its tarball.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One scope per image, otherwise the three jobs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    # After the images, so a release never points at images that failed to build.
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes docker-compose.release.yml .env.example
        env:
          GH_TOKEN: ${{ github.token }}
