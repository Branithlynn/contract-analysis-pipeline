name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      # The mock keeps ci fast, free and deterministic. Model quality is measured with the eval
      # harness against real providers, not here.
      LLM_PROVIDER: mock
      ALLOW_MOCK: "true"
      EMBED_PROVIDER: mock
      # With this set the e2e test fails instead of skipping when redis is not reachable.
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts for the same reason as in the Dockerfile: better-sqlite3 13 ships its
      # prebuilds in the tarball, but npm sees binding.gyp and would compile it with node-gyp.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --coverage
      - run: npm run samples
      - run: npm run test:e2e
      # Exits 0 on low scores, which the mock has on purpose. Non-zero only when the run breaks.
      - run: npm run eval -- --provider mock
      # Same for search: the mock embedder scores low, the step only fails when the run breaks.
      - run: npm run eval:retrieval -- --embed-provider mock
      # And for the agent: the mock chat model searches once and cites the first passage.
      - run: npm run eval:ask -- --provider mock --embed-provider mock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      # Search needs the sqlite-vec binary in the images, not only on the runner. The Dockerfile
      # checks it while building. This asks the two finished images once more, as the user they
      # run as, and compares vectors so a library that loads but does not work fails too.
      - name: sqlite-vec loads in the api and worker images
        run: |
          for service in api worker; do
            docker compose run --rm --no-deps -T --entrypoint node "$service" --input-type=module -e "
              import { openMemoryDb } from '@nexus/shared/node';
              const db = openMemoryDb();
              const distance = db
                .prepare('SELECT vec_distance_cosine(vec_f32(?), vec_f32(?)) AS d')
                .pluck()
                .get('[1, 0]', '[0, 1]');
              if (distance !== 1) throw new Error('vec_distance_cosine gave ' + distance);
              console.log('$service: sqlite-vec', db.prepare('SELECT vec_version()').pluck().get());
            "
          done
